# Repository layout manifest.
#
# Every application in this repository lives under apps/<name>/ and is a
# self-contained uv project: it owns its pyproject.toml, its uv.lock and its
# .venv, and its package sources live in its own src/ and tests/ trees.
#
# This root file is NOT a buildable project - it only registers the apps as
# members of the repository workspace. Run uv from inside an app directory
# (for example: cd apps/ai-gaming-agent-mcp && uv sync --extra dev); a uv run
# from this root would resolve against a lockfile that does not belong to any
# app.

[tool.uv.workspace]
members = ["apps/ai-gaming-agent-mcp"]
