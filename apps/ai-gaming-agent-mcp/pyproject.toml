[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-gaming-agent"
version = "0.2.0"
description = "MCP server for remote PC automation - enables AI agents to control gaming PCs"
readme = { text = "MCP server for remote PC automation - enables AI agents to control gaming PCs", content-type = "text/markdown" }
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "DeveloperZ AI" }
]
keywords = ["mcp", "automation", "gaming", "ai", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "mcp>=2.3.0,<3",
    "pyautogui>=0.9.54",
    "pillow>=10.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "screeninfo>=0.8.1",
    "psutil>=6.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyperclip>=1.8.0",
]

[project.optional-dependencies]
vlm = [
    "ollama>=0.4.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    # starlette's TestClient (used by tests/test_http_server.py) imports httpx.
    # mcp 1.x pulled it in transitively; mcp 2 uses httpx2 instead, so the test
    # dependency is declared here rather than inherited by accident.
    "httpx>=0.27.0",
]
integration = [
    "pytest>=8.0.0",
    "pytesseract>=0.3.10",
    # tests/integration/test_full_workflow.py talks to the HTTP server with httpx;
    # `uv sync --extra integration` is an exact sync, so it must request httpx itself.
    "httpx>=0.27.0",
]

[project.scripts]
gaming-agent = "ai_gaming_agent.cli:main"

[project.urls]
Homepage = "https://github.com/developerz-ai/ai-gaming-agent-mcp"
Repository = "https://github.com/developerz-ai/ai-gaming-agent-mcp"
Issues = "https://github.com/developerz-ai/ai-gaming-agent-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_gaming_agent"]

# This app is its own uv workspace root: uv resolves, locks and installs here,
# so the lockfile stays at apps/ai-gaming-agent-mcp/uv.lock. Run uv from this
# directory, never from the repository root.
[tool.uv.workspace]
members = []

# Advisory floors, not direct dependencies: these packages arrive transitively
# (certifi via httpx, python-multipart and pyjwt[crypto] via mcp, cryptography
# via pyjwt[crypto], starlette via fastapi/mcp/sse-starlette). The floors keep
# uv from locking back onto a version with a published advisory. The upper
# bounds are applied only to starlette, pyjwt and cryptography, whose next
# major would need a deliberate change here; certifi and python-multipart are
# floor-only, so a major bump of either can land without touching this file.
[tool.uv]
constraint-dependencies = [
    "certifi>=2026.10.19",
    "python-multipart>=0.0.31",
    "starlette>=0.51.0,<1",
    "pyjwt>=2.11.0,<3",
    "cryptography>=46.0.7,<47",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require display, run locally only)",
]
