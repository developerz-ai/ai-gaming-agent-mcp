name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CI: true  # Signals to skip integration tests

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/ai-gaming-agent-mcp/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb scrot python3-tk python3-dev

      # The same gate a developer runs locally (lint + unit tests); it syncs dependencies itself.
      - name: bin/check
        run: bin/check

  # Integration tests are LOCAL ONLY - they require a real display
  # Run locally with: cd apps/ai-gaming-agent-mcp && uv run pytest tests/integration -v
  #
  # Why integration tests can't run in CI:
  # - Require real display (X11/Wayland/Windows/macOS desktop)
  # - Perform actual mouse movements and clicks
  # - Open real applications (terminals)
  # - Need tesseract-ocr for OCR verification
  # - Could interfere with other processes
